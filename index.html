<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tra cứu HD05 — VPTW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --red: #B01228;
      --red-soft: #f3dfe2;
      --ink: #1c1a17;
      --ink-2: #55504a;
      --paper: #faf6ef;
      --card: #ffffff;
      --line: #e7e0d4;
      --gold: #9a7b2e;
      --shadow: 0 1px 2px rgba(28, 26, 23, .06), 0 8px 24px -12px rgba(28, 26, 23, .18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: "Be Vietnam Pro", "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      font-size: 16px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 14px 64px
    }

    /* ===== Header ===== */
    header.top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, var(--paper) 70%, rgba(250, 246, 239, .0));
      padding-top: env(safe-area-inset-top);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 14px 10px;
      max-width: 760px;
      margin: 0 auto
    }

    .brand .star {
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 8px;
      background: var(--red);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: var(--shadow)
    }

    .brand h1 {
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: .2px
    }

    .brand p {
      margin: 0;
      font-size: 11.5px;
      color: var(--ink-2);
      font-weight: 500
    }

    .searchbox {
      padding: 0 14px 8px;
      max-width: 760px;
      margin: 0 auto
    }

    .searchbox .field {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 13px;
      padding: 11px 13px;
      box-shadow: var(--shadow)
    }

    .searchbox input {
      border: 0;
      outline: 0;
      width: 100%;
      font: inherit;
      font-size: 16px;
      background: transparent;
      color: var(--ink)
    }

    .searchbox svg {
      flex: none;
      color: var(--ink-2)
    }

    .clearbtn {
      border: 0;
      background: var(--line);
      color: var(--ink-2);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      flex: none;
      display: none
    }

    .clearbtn.show {
      display: block
    }

    /* ===== Tabs ===== */
    .tabs {
      display: flex;
      gap: 6px;
      padding: 4px 14px 10px;
      max-width: 760px;
      margin: 0 auto;
      overflow-x: auto;
      scrollbar-width: none
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      flex: none;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--ink-2);
      padding: 8px 14px;
      border-radius: 20px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: .15s
    }

    .tab.active {
      background: var(--red);
      color: #fff;
      border-color: var(--red)
    }

    /* ===== Content ===== */
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0 14px
    }

    .chip {
      font-size: 11.5px;
      font-weight: 600;
      background: var(--red-soft);
      color: var(--red);
      padding: 4px 10px;
      border-radius: 999px
    }

    .chip.gray {
      background: #eee9df;
      color: var(--ink-2)
    }

    .grouphead {
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 22px 2px 9px
    }

    .grouphead:first-of-type {
      margin-top: 6px
    }

    .card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      margin-bottom: 9px;
      overflow: hidden;
      box-shadow: var(--shadow)
    }

    .card>button.head {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      padding: 13px 15px;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      font: inherit
    }

    .num {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--red);
      flex: none;
      min-width: 20px;
      line-height: 1.45
    }

    .htext {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .htext .t {
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      line-height: 1.35
    }

    .htext .s {
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.4
    }

    .chev {
      flex: none;
      color: var(--ink-2);
      transition: transform .2s;
      margin-top: 3px
    }

    .card.open .chev {
      transform: rotate(180deg)
    }

    .body {
      display: none;
      padding: 0 15px 15px;
      animation: fade .2s ease
    }

    .card.open .body {
      display: block
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(-3px)
      }

      to {
        opacity: 1
      }
    }

    .body p {
      margin: 0 0 8px
    }

    .body ul {
      margin: 2px 0 10px;
      padding-left: 18px
    }

    .body li {
      margin-bottom: 5px;
      font-size: 14.5px
    }

    .body .pin {
      background: var(--red-soft);
      color: var(--red);
      font-weight: 600;
      font-size: 13px;
      padding: 7px 11px;
      border-radius: 9px;
      margin: 2px 0 10px;
      display: block
    }

    .body b {
      color: var(--ink)
    }

    .kbd {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 600;
      background: #f0ebe0;
      border: 1px solid var(--line);
      padding: 1px 7px;
      border-radius: 6px;
      font-size: 13.5px;
      color: var(--ink);
      white-space: nowrap
    }

    /* ===== Tables ===== */
    .tbl {
      width: 100%;
      border-collapse: collapse;
      margin: 2px 0 6px;
      font-size: 13.5px
    }

    .tbl th,
    .tbl td {
      border: 1px solid var(--line);
      padding: 7px 9px;
      text-align: left;
      vertical-align: top
    }

    .tbl th {
      background: #f3eee3;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--ink-2)
    }

    .tbl td .kbd {
      font-size: 13px
    }

    .tbl tr:nth-child(even) td {
      background: #fcfaf5
    }

    .empty {
      text-align: center;
      color: var(--ink-2);
      padding: 48px 20px;
      font-size: 14.5px
    }

    .empty b {
      display: block;
      color: var(--ink);
      font-size: 16px;
      margin-bottom: 4px
    }

    mark {
      background: #ffe9a8;
      color: inherit;
      padding: 0 1px;
      border-radius: 3px
    }

    .footer {
      text-align: center;
      font-size: 11.5px;
      color: var(--ink-2);
      margin-top: 26px;
      line-height: 1.6
    }
  </style>
</head>

    /* ---------- RENDER ---------- */
    const main = document.getElementById('main');
    const tabsEl = document.getElementById('tabs');
    const qEl = document.getElementById('q');
    const clearEl = document.getElementById('clear');
    let current = 'hd05', query = '';

    function norm(s) {
      return (s || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
    }

    function hl(text, q) {
      if (!q) return text;
      const nq = norm(q), nt = norm(text);
      const i = nt.indexOf(nq);
      if (i < 0) return text;
      return text.slice(0, i) + '<mark>' + text.slice(i, i + q.length) + '</mark>' + text.slice(i + q.length);
    }

    function render() {
      const d = DATA[current];
      const nq = norm(query.trim());
      let html = '';
      html += '<div class="meta">' + d.meta.map((m, i) => '<span class="chip' + (i ? ' gray' : '') + '">' + m + '</span>').join('') + '</div>';
      let shown = 0;
      d.groups.forEach(g => {
        const matched = g.items.filter(it => {
          if (!nq) return true;
          return norm(it.t + ' ' + it.s + ' ' + (it.k || '') + ' ' + it.body).includes(nq);
        });
        if (!matched.length) return;
        html += '<div class="grouphead">' + g.name + '</div>';
        matched.forEach(it => {
          shown++;
          const open = nq ? ' open' : '';
          html += '<div class="card' + open + '">'
            + '<button class="head" type="button">'
            + (it.n ? '<span class="num">' + it.n + '</span>' : '')
            + '<span class="htext"><span class="t">' + hl(it.t, query.trim()) + '</span>'
            + '<span class="s">' + hl(it.s, query.trim()) + '</span></span>'
            + '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>'
            + '</button>'
            + '<div class="body">' + it.body + '</div>'
            + '</div>';
        });
      });
      if (!shown) {
        html += '<div class="empty"><b>Không tìm thấy</b>Thử từ khoá khác, ví dụ: <i>định lề, ký hiệu, mã hồ sơ, thời hạn</i>.</div>';
      }
      main.innerHTML = html;
      main.querySelectorAll('.card').forEach(c => {
        c.querySelector('.head').addEventListener('click', () => c.classList.toggle('open'));
      });
    }

    tabsEl.addEventListener('click', e => {
      const b = e.target.closest('.tab'); if (!b) return;
      current = b.dataset.tab;
      tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
      window.scrollTo({ top: 0 });
      render();
    });
    qEl.addEventListener('input', () => {
      query = qEl.value;
      clearEl.classList.toggle('show', !!query);
      render();
    });
    clearEl.addEventListener('click', () => { query = ''; qEl.value = ''; clearEl.classList.remove('show'); qEl.focus(); render(); });

    render();
  </script>
